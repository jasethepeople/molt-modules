[package]
name = "molt-kernel"
version = "0.1.0-alpha.2"
edition = "2021"
license = "Apache-2.0"
description = "MOLT protocol kernel: durable event history, deterministic replay, resources, and experiment provenance"

[dependencies]
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
proptest = "1.5"

[lib]
path = "kernel/mod.rs"
